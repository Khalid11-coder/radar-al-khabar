name: 🗞️ Radar Al-Khabar — News Auto-Feeder

on:
  schedule:
    # Runs every 30 minutes, 24/7
    - cron: '*/30 * * * *'
  
  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run even if recently executed'
        required: false
        default: false
        type: boolean

jobs:
  feed-news:
    name: 📰 Fetch & Save Arabic News
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── Checkout ──────────────────────────────────────────
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      # ── Setup Node.js ─────────────────────────────────────
      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # حذفنا سطر الـ cache هنا عشان نتخطى تدقيق الملفات الصارم

      # ── Install Dependencies ──────────────────────────────
      - name: 📥 Install Dependencies
        run: npm install  # غيرناها من ci إلى install لمرونة أكبر في التحميل

      # ── Run the Feeder ────────────────────────────────────
      - name: 🚀 Run News Feeder Script
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}  # تأكد من تطابق اسم الـ Secret في GitHub
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NODE_ENV: production
        run: node scripts/news-feeder.js

      # ── Log Success ───────────────────────────────────────
      - name: ✅ Log Completion Time
        if: success()
        run: |
          echo "✅ News feed completed successfully at $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "Next run: in ~30 minutes"

      # ── Notify on Failure ─────────────────────────────────
      - name: ❌ Log Failure
        if: failure()
        run: |
          echo "❌ News feed FAILED at $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "Please check the logs above for details."