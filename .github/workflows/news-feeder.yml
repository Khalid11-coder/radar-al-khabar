name: 🗞️ Radar Al-Khabar — News Auto-Feeder

on:
  schedule:
    - cron: '0 0 * * *'  # سيتم التشغيل مرة واحدة يومياً عند منتصف الليل
  
  # يسمح لك بتشغيله يدوياً من صفحة Actions
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run even if recently executed'
        required: false
        default: false
        type: boolean

jobs:
  feed-news:
    name: 📰 Fetch & Save Arabic News
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── سحب الكود من GitHub ──────────────────────────────────
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      # ── إعداد بيئة Node.js ─────────────────────────────────────
      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # تم حذف سطر الـ cache نهائياً لتجنب أخطاء التدقيق الصارمة

      # ── تثبيت المكتبات البرمجية ──────────────────────────────
      - name: 📥 Install Dependencies
        run: npm install  # استخدام install بدلاً من ci للمرونة القصوى

      # ── تشغيل سكربت الرادار ────────────────────────────────────
      - name: 🚀 Run News Feeder Script
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NODE_ENV: production
        run: node scripts/news-feeder.js

      # ── تسجيل النجاح ───────────────────────────────────────
      - name: ✅ Log Completion Time
        if: success()
        run: |
          echo "✅ News feed completed successfully at $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "Next run: in ~30 minutes"

      # ── التنبيه في حالة الفشل ─────────────────────────────────
      - name: ❌ Log Failure
        if: failure()
        run: |
          echo "❌ News feed FAILED at $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "Please check the logs above for details."